<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Blue background circle -->
  <circle cx="100" cy="100" r="98" fill="#0B3D91"/>
  
  <!-- White oval/ellipse (orbital path) -->
  <ellipse cx="100" cy="100" rx="90" ry="46" fill="none" stroke="white" stroke-width="5" transform="rotate(-28 100 100)"/>
  
  <!-- Red swoosh/vector -->
  <path d="M 12 130 C 35 75 75 52 100 50 C 125 52 165 75 188 130" 
        fill="none" stroke="#FC3D21" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Blue bar (covering middle of ellipse) -->
  <rect x="4" y="82" width="192" height="36" fill="#0B3D91"/>
  
  <!-- NASA white text -->
  <text x="100" y="112" 
        font-family="Arial Black, Impact, sans-serif" 
        font-weight="900" 
        font-size="46" 
        fill="white" 
        text-anchor="middle" 
        letter-spacing="2">NASA</text>
  
  <!-- Stars in upper blue area -->
  <circle cx="32" cy="46" r="3.5" fill="white"/>
  <circle cx="58" cy="28" r="2.5" fill="white"/>
  <circle cx="100" cy="22" r="3" fill="white"/>
  <circle cx="142" cy="28" r="2.5" fill="white"/>
  <circle cx="168" cy="46" r="3.5" fill="white"/>
  <circle cx="20" cy="70" r="2" fill="white"/>
  <circle cx="180" cy="70" r="2" fill="white"/>
  
  <!-- Outer border -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="white" stroke-width="2"/>
</svg>
